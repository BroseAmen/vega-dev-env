<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var id = p.get('id');
  var ep = p.get('ep');
  var mode = p.get('mode') || 'sub';
  if (!id || !ep) {
    document.body.style.color = '#fff';
    document.body.textContent = 'Missing id or ep parameter';
    return;
  }

  function send(msg) {
    window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({tag:'EMBED', msg:msg}));
  }

  send('wrapper origin=' + location.origin + ' href=' + location.href);

  // === MSE / MEDIA CAPABILITY PROBE ===
  var probe = {};
  probe.typeofMediaSource = typeof window.MediaSource;
  probe.mediaSourceExists = !!window.MediaSource;

  if (window.MediaSource && window.MediaSource.isTypeSupported) {
    probe.mse_mp4_baseline = window.MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E,mp4a.40.2"');
    probe.mse_mp4_high     = window.MediaSource.isTypeSupported('video/mp4; codecs="avc1.640028,mp4a.40.2"');
    probe.mse_webm_vp9     = window.MediaSource.isTypeSupported('video/webm; codecs="vp9,opus"');
  } else {
    probe.mse_mp4_baseline = 'N/A (no MediaSource)';
    probe.mse_mp4_high     = 'N/A (no MediaSource)';
    probe.mse_webm_vp9     = 'N/A (no MediaSource)';
  }

  var video = document.createElement('video');
  probe.videoElementCreated = !!video;
  probe.canPlay_hls_apple   = video.canPlayType('application/vnd.apple.mpegurl');
  probe.canPlay_hls_x       = video.canPlayType('application/x-mpegURL');
  probe.canPlay_mp4         = video.canPlayType('video/mp4');
  probe.readyState          = video.readyState;
  probe.networkState        = video.networkState;

  send('=== MSE PROBE ===');
  var keys = Object.keys(probe);
  for (var i = 0; i < keys.length; i++) {
    send('PROBE: ' + keys[i] + ' = ' + JSON.stringify(probe[keys[i]]));
  }
  send('=== END MSE PROBE ===');

  // === NETWORK ACTIVITY MONITOR ===
  // NOTE: This PerfObserver can only see resources in THIS wrapper document,
  // NOT inside the cross-origin MegaPlay iframe. The postMessage listener
  // below is the primary diagnostic for MegaPlay player state.
  var mediaRequests = [];
  if (window.PerformanceObserver) {
    try {
      new PerformanceObserver(function(list) {
        list.getEntries().forEach(function(e) {
          if (e.entryType === 'resource') {
            var isMedia = /\.(m3u8|mpd|ts|m4s|mp4|webm|key)(\?|$)/i.test(e.name);
            var isMega = /megaplay\.buzz/i.test(e.name);
            if (isMedia || isMega) {
              var extra = '';
              if (e.responseStatus) extra += ' status=' + e.responseStatus;
              if (e.transferSize !== undefined) extra += ' xfer=' + e.transferSize;
              mediaRequests.push(e.name);
              send('NET: ' + e.initiatorType + ' ' + Math.round(e.duration) + 'ms' + extra + ' ' + e.name);
            }
          }
        });
      }).observe({entryTypes: ['resource']});
    } catch(ex) { send('PerfObserver error: ' + ex.message); }
  }

  // === AUTOPLAY / PERMISSIONS PROBE ===
  var permProbe = {};
  permProbe.featurePolicyExists = !!document.featurePolicy;
  if (document.featurePolicy && document.featurePolicy.allowsFeature) {
    try { permProbe.autoplayAllowed = document.featurePolicy.allowsFeature('autoplay'); } catch(e) { permProbe.autoplayAllowed = 'error: ' + e.message; }
    try { permProbe.encryptedMediaAllowed = document.featurePolicy.allowsFeature('encrypted-media'); } catch(e) { permProbe.encryptedMediaAllowed = 'error: ' + e.message; }
  }
  permProbe.permissionsPolicyExists = !!document.permissionsPolicy;
  send('PERM_PROBE: ' + JSON.stringify(permProbe));

  // === MEGAPLAY postMessage LISTENER ===
  var mpEvents = {time:0, error:0, complete:0, watchingLog:0, other:0};
  var firstTimeEvent = null;
  var lastTimeEvent = null;
  var mpErrors = [];

  window.addEventListener('message', function(event) {
    var data = event.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch(e) { return; }
    }
    if (!data || typeof data !== 'object') return;

    var evtType = data.type || data.event;
    if (data.channel === 'megacloud') {
      if (evtType === 'time') {
        mpEvents.time++;
        lastTimeEvent = {currentTime: data.currentTime, duration: data.duration};
        if (!firstTimeEvent) {
          firstTimeEvent = Date.now();
          send('MP_EVENT: first TIME event! currentTime=' + data.currentTime + ' duration=' + data.duration);
        }
        if (mpEvents.time % 10 === 0) {
          send('MP_EVENT: TIME x' + mpEvents.time + ' currentTime=' + data.currentTime + ' duration=' + data.duration);
        }
      } else if (evtType === 'error') {
        mpEvents.error++;
        var errStr = JSON.stringify(data).substring(0, 300);
        mpErrors.push(errStr);
        send('MP_EVENT: *** ERROR *** ' + errStr);
      } else if (evtType === 'complete') {
        mpEvents.complete++;
        send('MP_EVENT: COMPLETE');
      } else {
        mpEvents.other++;
        send('MP_EVENT: channel=megacloud event=' + evtType + ' ' + JSON.stringify(data).substring(0, 200));
      }
    } else if (evtType === 'watching-log' || data.type === 'watching-log') {
      mpEvents.watchingLog++;
      if (mpEvents.watchingLog <= 3 || mpEvents.watchingLog % 10 === 0) {
        send('MP_EVENT: watching-log #' + mpEvents.watchingLog + ' currentTime=' + data.currentTime + ' duration=' + data.duration);
      }
    } else {
      send('MP_MSG: origin=' + event.origin + ' keys=' + Object.keys(data).join(',') + ' ' + JSON.stringify(data).substring(0, 200));
    }
  });
  send('postMessage listener registered for MegaPlay events');

  // === TIMED CHECKS ===
  setTimeout(function() {
    send('=== 5s CHECK ===');
    send('MP events: time=' + mpEvents.time + ' error=' + mpEvents.error + ' complete=' + mpEvents.complete + ' watchingLog=' + mpEvents.watchingLog + ' other=' + mpEvents.other);
    if (mpEvents.time > 0) {
      send('PLAYBACK DETECTED at 5s');
      if (lastTimeEvent) send('last time: currentTime=' + lastTimeEvent.currentTime + ' duration=' + lastTimeEvent.duration);
    } else if (mpEvents.error > 0) {
      send('*** PLAYER ERROR at 5s ***');
      for (var e = 0; e < mpErrors.length; e++) send('MP_ERR[' + e + ']: ' + mpErrors[e]);
    } else {
      send('*** NO MEGAPLAY EVENTS AT 5s ***');
    }
    send('wrapper-level media requests (same-origin only): ' + mediaRequests.length);
  }, 5000);

  setTimeout(function() {
    send('=== 12s CHECK ===');
    send('MP events: time=' + mpEvents.time + ' error=' + mpEvents.error + ' complete=' + mpEvents.complete + ' watchingLog=' + mpEvents.watchingLog + ' other=' + mpEvents.other);
    if (lastTimeEvent) send('last time: currentTime=' + lastTimeEvent.currentTime + ' duration=' + lastTimeEvent.duration);
    if (mpErrors.length > 0) {
      send('=== MP ERRORS ===');
      for (var e = 0; e < mpErrors.length; e++) send('MP_ERR[' + e + ']: ' + mpErrors[e]);
    }

    send('=== DIAGNOSIS ===');
    if (mpEvents.time > 0) {
      send('CLASS-A: Video IS playing — MegaPlay sending time events');
    } else if (mpEvents.error > 0) {
      send('CLASS-B: MegaPlay player reported error(s) — see MP_ERR above');
    } else if (mpEvents.watchingLog > 0) {
      send('CLASS-C: watching-log but no time events — player loaded, video stuck');
    } else {
      send('CLASS-D: No MegaPlay events at all — player may not have initialized');
      send('Possible causes: autoplay policy, getSources failure, or cross-origin restriction');
    }
  }, 12000);

  setTimeout(function() {
    send('=== 20s FINAL ===');
    send('MP events: time=' + mpEvents.time + ' error=' + mpEvents.error + ' complete=' + mpEvents.complete + ' watchingLog=' + mpEvents.watchingLog + ' other=' + mpEvents.other);
    if (lastTimeEvent) send('last time: currentTime=' + lastTimeEvent.currentTime + ' duration=' + lastTimeEvent.duration);
    if (mpEvents.time === 0 && mpEvents.error === 0 && mpEvents.watchingLog === 0) {
      send('*** 20s NO MEGAPLAY EVENTS — likely autoplay blocked or player script failed ***');
    }
  }, 20000);

  // === CREATE IFRAME ===
  var url = 'https://megaplay.buzz/stream/mal/' + encodeURIComponent(id) + '/' + encodeURIComponent(ep) + '/' + encodeURIComponent(mode);
  send('creating iframe src=' + url);
  var iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.allowFullscreen = true;
  iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
  iframe.setAttribute('scrolling', 'no');

  send('iframe allow="' + (iframe.getAttribute('allow') || '(none)') + '" sandbox="' + (iframe.getAttribute('sandbox') || '(none)') + '"');

  iframe.addEventListener('load', function() {
    send('iframe LOAD event');
  });
  iframe.addEventListener('error', function(ev) {
    send('iframe ERROR event type=' + ev.type);
  });

  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
