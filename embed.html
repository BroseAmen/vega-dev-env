<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var id = p.get('id');
  var ep = p.get('ep');
  var mode = p.get('mode') || 'sub';
  if (!id || !ep) {
    document.body.style.color = '#fff';
    document.body.textContent = 'Missing id or ep parameter';
    return;
  }

  var url = 'https://megaplay.buzz/stream/mal/' + encodeURIComponent(id) + '/' + encodeURIComponent(ep) + '/' + encodeURIComponent(mode);
  var iframe = document.createElement('iframe');

  // MegaPlay documents this URL as an embed. Keeping it in an iframe preserves
  // the HTTPS parent referrer and delegates playback to the provider player.
  iframe.src = url;
  iframe.title = 'Anime player';
  iframe.allowFullscreen = true;
  iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
  iframe.setAttribute('scrolling', 'no');

  function send(tag, msg) {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({tag:tag, msg:msg}));
    }
  }

  iframe.addEventListener('load', function() {
    send('EMBED', 'MegaPlay iframe loaded');
  });

  // Relay provider events for the app's optional diagnostics without trying to
  // control the cross-origin video element.
  window.addEventListener('message', function(event) {
    if (event.source !== iframe.contentWindow || event.origin !== 'https://megaplay.buzz') return;
    var data = event.data;
    if (typeof data !== 'string') {
      try { data = JSON.stringify(data); } catch (error) { data = '[unserializable provider event]'; }
    }
    send('MEGAPLAY_EVENT', data.slice(0, 500));
  });

  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
